<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5536"/>
      <stop offset="0.5" stop-color="#5a3a20"/>
      <stop offset="1" stop-color="#3f2814"/>
    </linearGradient>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="512" height="120" patternTransform="rotate(96)">
      <rect width="512" height="120" fill="transparent"/>
      <line x1="0" y1="20" x2="512" y2="20" stroke="rgba(255,235,200,0.06)" stroke-width="2"/>
      <line x1="0" y1="55" x2="512" y2="55" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
      <line x1="0" y1="88" x2="512" y2="88" stroke="rgba(255,225,180,0.05)" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#wood)"/>
